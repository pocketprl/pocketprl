name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Matches compileOptions/targetCompatibility 17 so bytecode does not
      # depend on whatever JDK a contributor happens to have installed.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # A throwaway key so the release signing path is exercised end to end.
      # CI artifacts are NOT for distribution; the real key stays offline.
      - name: Generate ephemeral CI signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.jks" -storetype PKCS12 \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 \
            -storepass cipassword -keypass cipassword -dname "CN=PocketPRL CI" > /dev/null
          {
            echo "POCKETPRL_KEYSTORE=$RUNNER_TEMP/ci.jks"
            echo "POCKETPRL_KEYSTORE_PASSWORD=cipassword"
            echo "POCKETPRL_KEY_ALIAS=ci"
            echo "POCKETPRL_KEY_PASSWORD=cipassword"
          } >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble debug
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble release (R8, CI-signed, not for distribution)
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
